<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affiliate Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Dentiste' CI ===== */
  :root {
    color-scheme: light;
    --green: #00786A; --green-dark: #005A50; --green-tint: #E6F2F0; --green-hi: #12A08F;
    --ink: #0F2A26; --muted: #5B6B68; --line: rgba(0, 90, 80, .12);
    --warn: #B45309; --warn-tint: rgba(254, 243, 199, .85); --bad: #B91C1C; --bad-tint: rgba(254, 226, 226, .85); --info: #1D4ED8; --info-tint: rgba(219, 234, 254, .85);
    --radius: 24px;
    /* Liquid Glass recipe */
    --glass-fill: rgba(255, 255, 255, .52);
    --glass-edge: rgba(255, 255, 255, .75);
    --glass-blur: blur(22px) saturate(185%);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.35), 0 10px 30px rgba(0, 90, 80, .12), 0 1px 2px rgba(0, 90, 80, .08);
    --fill-soft: rgba(255, 255, 255, .62);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--ink); font-family: 'Noto Sans Thai', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  html { background: #E9F3F1; }
  body { min-height: 100vh; padding-bottom: calc(104px + env(safe-area-inset-bottom)); }

  /* ===== พื้นหลังให้กระจกมีอะไรหักเห (Brand ambient) ===== */
  .ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(180deg, #DCEFEB 0%, #F2F8F7 55%, #E4F1EE 100%); }
  .ambient i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .75; }
  .ambient i:nth-child(1) { width: 340px; height: 340px; left: -110px; top: -120px; background: #00786A; opacity: .55; }
  .ambient i:nth-child(2) { width: 300px; height: 300px; right: -120px; top: 140px; background: #5CC8B8; }
  .ambient i:nth-child(3) { width: 360px; height: 360px; left: 10%; bottom: -160px; background: #9ADBD0; }
  .ambient i:nth-child(4) { width: 180px; height: 180px; right: 12%; bottom: 22%; background: #FFFFFF; opacity: .9; }

  /* ===== วัสดุกระจก ===== */
  .glass, .card, .prod, nav, .mockbar, .toast {
    position: relative; background: var(--glass-fill);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow);
  }
  /* แสงสะท้อน specular ขอบบน */
  .card::before, .prod::before, nav::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.18) 100%);
  }
  .card > *, .prod > * { position: relative; }

  /* ===== Header — Large title แบบ iOS ===== */
  header { padding: calc(22px + env(safe-area-inset-top)) 20px 18px; }
  header .brand { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green-dark); }
  header .brand .dot { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(145deg, var(--green-hi), var(--green-dark)); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); display: grid; place-items: center; color: #fff; font-size: 11px; letter-spacing: 0; }
  header h1 { margin: 12px 0 0; font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; color: var(--green-dark); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  main { padding: 0 16px; }

  /* ===== Card ===== */
  .card { border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; color: var(--green-dark); }
  .muted { color: var(--muted); font-size: 13px; }

  /* ===== Form ===== */
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  label .req { color: var(--bad); }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; font: inherit; background: var(--fill-soft); color: var(--ink); box-shadow: inset 0 1px 2px rgba(0,90,80,.06); transition: box-shadow .2s, border-color .2s, background .2s; -webkit-appearance: none; appearance: none; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--green) 50%), linear-gradient(135deg, var(--green) 50%, transparent 50%); background-position: calc(100% - 20px) 52%, calc(100% - 15px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  input:focus, select:focus, textarea:focus { outline: none; background-color: rgba(255,255,255,.9); border-color: rgba(0,120,106,.55); box-shadow: 0 0 0 4px rgba(0,120,106,.16); }
  textarea { min-height: 76px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--fill-soft); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; user-select: none; transition: transform .15s, background .2s; }
  .chip:active { transform: scale(.96); }
  .chip.on { background: linear-gradient(145deg, var(--green-hi), var(--green)); border-color: transparent; color: #fff; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 12px rgba(0,120,106,.25); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 13px; }
  .check input { width: 22px; height: 22px; margin-top: 1px; flex: none; padding: 0; border-radius: 7px; display: grid; place-items: center; }
  .check input:checked { background: var(--green); border-color: var(--green); }
  .check input:checked::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }

  /* ===== ปุ่ม — capsule, teal glass tint ===== */
  .btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 14px; font: inherit; font-weight: 700; color: #fff; cursor: pointer; text-align: center; text-decoration: none;
    background: linear-gradient(180deg, var(--green-hi) 0%, var(--green) 55%, var(--green-dark) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,40,35,.25), 0 8px 20px rgba(0,120,106,.28);
    transition: transform .15s, box-shadow .2s, filter .2s; }
  .btn:active { transform: scale(.97); filter: brightness(.95); }
  .btn[disabled] { background: rgba(120, 140, 137, .28); color: rgba(15,42,38,.45); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); cursor: not-allowed; transform: none; }
  .btn.ghost { background: var(--fill-soft); color: var(--green-dark); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 1px rgba(0,120,106,.35); }
  .btn.ghost[disabled] { color: var(--green-dark); opacity: 1; background: rgba(230,242,240,.7); }
  .btn.sm { display: inline-block; width: auto; padding: 8px 16px; font-size: 13px; }

  /* ===== Badge ===== */
  .badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.7); color: var(--muted); border: 1px solid rgba(255,255,255,.8); }
  .badge.good { background: rgba(0,120,106,.12); color: var(--green-dark); border-color: rgba(0,120,106,.18); }
  .badge.warn { background: var(--warn-tint); color: var(--warn); }
  .badge.bad { background: var(--bad-tint); color: var(--bad); }
  .badge.info { background: var(--info-tint); color: var(--info); }

  /* ===== สินค้า / รางวัล ===== */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .prod { border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .prod .img { margin: 8px 8px 0; border-radius: 18px; overflow: hidden; aspect-ratio: 1; background: linear-gradient(150deg, rgba(0,120,106,.18), rgba(92,200,184,.12)); display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .prod .img img { width: 100%; height: 100%; object-fit: cover; }
  .prod .b { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .prod .name { font-weight: 600; font-size: 14px; }
  .prod .btn { margin-top: auto; padding: 10px; font-size: 13px; }

  /* ===== ตัวเลข / Progress ===== */
  .stat { display: flex; justify-content: space-between; align-items: baseline; }
  .big { font-size: 32px; font-weight: 700; color: var(--green-dark); letter-spacing: -.01em; }
  .bar { height: 12px; border-radius: 999px; background: rgba(0,90,80,.08); box-shadow: inset 0 1px 2px rgba(0,90,80,.12); overflow: hidden; margin: 12px 0 8px; }
  .bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), var(--green-hi)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .steps { display: grid; gap: 8px; margin-top: 12px; }
  .step { display: flex; justify-content: space-between; padding: 11px 14px; border-radius: 16px; font-size: 14px; background: rgba(255,255,255,.45); border: 1px solid var(--line); }
  .step.hit { background: rgba(0,120,106,.12); border-color: rgba(0,120,106,.35); color: var(--green-dark); }

  /* ===== List ===== */
  .list .item { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .list .item:last-child { border-bottom: 0; padding-bottom: 2px; }
  .item .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .item .title { font-weight: 600; }
  .inline { display: flex; gap: 8px; margin-top: 10px; }
  .inline input { flex: 1; }
  .code { font-size: 32px; font-weight: 700; letter-spacing: 6px; text-align: center; padding: 16px; border-radius: 18px; color: var(--green-dark); background: linear-gradient(150deg, rgba(0,120,106,.14), rgba(255,255,255,.55)); border: 1px solid rgba(255,255,255,.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.9); }

  /* ===== Tab bar — แคปซูลลอย ===== */
  nav { position: fixed; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); border-radius: 32px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; z-index: 5; }
  nav[hidden] { display: none; }
  nav a { position: relative; z-index: 1; text-align: center; padding: 7px 2px 6px; border-radius: 24px; font-size: 10.5px; line-height: 1.25; color: var(--muted); text-decoration: none; cursor: pointer; transition: background .25s, color .25s, transform .15s; }
  nav a:active { transform: scale(.94); }
  nav a svg { display: block; width: 24px; height: 24px; margin: 0 auto 2px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav a.on { color: var(--green-dark); font-weight: 700; background: rgba(0,120,106,.13); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }

  /* ===== Toast / Mock bar ===== */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(100px + env(safe-area-inset-bottom)); background: rgba(15, 42, 38, .72); border-color: rgba(255,255,255,.18); color: #fff; padding: 13px 16px; border-radius: 20px; font-size: 14px; z-index: 10; opacity: 0; transform: translateY(12px) scale(.98); transition: .3s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { background: rgba(185, 28, 28, .82); }
  .mockbar { margin: calc(10px + env(safe-area-inset-top)) 16px -6px; border-radius: 999px; color: var(--warn); font-size: 12px; padding: 6px 14px; text-align: center; }
  .mockbar[hidden] { display: none; }

  .center { text-align: center; padding: 40px 18px; }
  .spinner { width: 34px; height: 34px; border: 3px solid rgba(0,120,106,.15); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  a { color: var(--green); }

  /* ===== Fallback & Accessibility ===== */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card, .prod, nav, .mockbar { background: rgba(255,255,255,.92); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .card, .prod, nav, .mockbar { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .toast { background: #0F2A26; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .ambient i { display: none; }
  }
  @media (prefers-contrast: more) {
    :root { --glass-fill: rgba(255,255,255,.9); --line: rgba(0,90,80,.35); --muted: #3B4A47; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="mockbar" class="mockbar" hidden>โหมดตัวอย่าง (Prototype) — ข้อมูลจำลอง ไม่ได้เชื่อมระบบจริง</div>
<header>
  <span class="brand glass"><span class="dot">D</span>Dentiste' · Affiliate Club</span>
  <h1 id="h-title">Affiliate Club</h1><p id="h-sub">กำลังโหลด…</p>
</header>
<main id="app"><div class="card center"><div class="spinner"></div><div class="muted">กำลังโหลด…</div></div></main>
<nav id="nav" hidden>
  <a data-p="catalog"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>ขอตัวอย่าง</a>
  <a data-p="requests"><svg viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>พัสดุ</a>
  <a data-p="me"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>แต้ม & Bonus</a>
  <a data-p="rewards"><svg viewBox="0 0 24 24"><path d="M4 11h16v10H4zM3 7h18v4H3zM12 7v14"/><path d="M12 7c-1.5-3-5-3.5-5-1.2C7 7 9 7 12 7c3 0 5 0 5-1.2C17 3.5 13.5 4 12 7z"/></svg>แลกรางวัล</a>
  <a data-p="invite"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M18 8v6M15 11h6"/></svg>ชวนเพื่อน</a>
</nav>
<div id="toast" class="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===== ตั้งค่า: แก้ 2 บรรทัดนี้หลัง Deploy ===== */
const LIFF_ID = '2012132241-ifUH9yrd';
const API_URL = 'https://script.google.com/macros/s/AKfycbwZYpEBmFgLHa85fLGCe_m-_iq3DA_TMjVpmx_ERLBB_S2WpNef7toQzSBE3kNFVFfSIA/exec';
/* ============================================ */

const PLATFORMS = ['TikTok', 'Shopee', 'Lazada', 'Facebook', 'Instagram', 'YouTube', 'อื่นๆ'];
const CATEGORIES = ['Beauty', 'Fashion', 'Food', 'Health', 'Gadget', 'Home', 'Mom & Kids'];
const PAGES = { register: pageRegister, catalog: pageCatalog, requests: pageRequests, me: pageMe, rewards: pageRewards, invite: pageInvite };
const params = new URLSearchParams(location.search);
const MOCK = params.get('mock') === '1' || LIFF_ID.startsWith('YOUR_');
const state = { me: null, page: params.get('page') || 'register', ref: params.get('ref') || '', campaign: params.get('c') || '' };

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmt = n => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 });

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = 'toast'; }, 2800);
}
function loading(msg) { app.innerHTML = `<div class="card center"><div class="spinner"></div><div class="muted">${esc(msg || 'กำลังโหลด…')}</div></div>`; }
function header(title, sub) { $('#h-title').textContent = title; $('#h-sub').textContent = sub || ''; }

async function api(action, data) {
  if (MOCK) return mockApi(action, data || {});
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, data || {})),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

async function boot() {
  try {
    if (MOCK) { $('#mockbar').hidden = false; }
    else {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      // หลัง init, query เดิมจาก liff.state จะกลับมาอยู่ใน location
      const p = new URLSearchParams(location.search);
      state.page = p.get('page') || state.page; state.ref = p.get('ref') || state.ref; state.campaign = p.get('c') || state.campaign;
    }
    state.me = await api('me', { ref: state.ref, campaign: state.campaign });
    $('#h-title').textContent = state.me.brand || 'Affiliate Club';
    const approved = state.me.affiliate && state.me.affiliate.status === 'approved';
    if (!approved && state.page !== 'register') state.page = 'register';
    if (approved && state.page === 'register') state.page = 'me';
    go(state.page);
  } catch (e) {
    app.innerHTML = `<div class="card center"><h2>เปิดหน้าไม่สำเร็จ</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">ลองใหม่</button></div>`;
  }
}

function go(page) {
  state.page = PAGES[page] ? page : 'me';
  const approved = state.me && state.me.affiliate && state.me.affiliate.status === 'approved';
  $('#nav').hidden = !approved;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.p === state.page));
  window.scrollTo(0, 0);
  PAGES[state.page]();
}
document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', () => go(a.dataset.p)));

async function act(btn, fn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'กำลังดำเนินการ…';
  try { await fn(); } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = label; }
}

/* ---------- สมัคร ---------- */
function pageRegister() {
  const a = state.me.affiliate;
  if (a) {
    const map = { pending: ['รอตรวจสอบ', 'warn', 'ทีมงานกำลังตรวจใบสมัคร จะแจ้งผลทาง LINE'], rejected: ['ไม่ผ่าน', 'bad', 'สอบถามเพิ่มเติมได้ที่แชท'], suspended: ['ระงับชั่วคราว', 'bad', 'ติดต่อแอดมินที่แชท'] };
    const s = map[a.status] || [a.status, '', ''];
    header('ใบสมัครของคุณ', a.full_name);
    app.innerHTML = `<div class="card center"><span class="badge ${s[1]}">${esc(s[0])}</span><h2 style="margin-top:12px">${esc(a.full_name)}</h2><p class="muted">${esc(s[2])}<br>สมัครเมื่อ ${esc(a.registered_at)}</p>
      ${!MOCK ? '<button class="btn ghost" onclick="liff.closeWindow()">กลับไปที่แชท</button>' : ''}</div>`;
    return;
  }
  header('สมัคร Affiliate', 'ฟรี · รับสินค้าตัวอย่าง · สะสมแต้ม · รับ Bonus ตามยอดขาย');
  app.innerHTML = `
  <form class="card" id="f" novalidate>
    <h2>ข้อมูลผู้สมัคร</h2>
    ${state.ref || state.me.lead_ref ? `<p class="muted">รหัสผู้แนะนำ: <b>${esc(state.ref || state.me.lead_ref)}</b></p>` : ''}
    <label>ชื่อ-นามสกุล <span class="req">*</span></label><input name="full_name" autocomplete="name" required>
    <label>เบอร์โทร <span class="req">*</span></label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxx" required>
    <h2 style="margin-top:20px">ช่องทางของคุณ</h2>
    <label>แพลตฟอร์มหลัก <span class="req">*</span></label>
    <select name="platform" required><option value="">เลือก…</option>${PLATFORMS.map(p => `<option>${p}</option>`).join('')}</select>
    <label>ลิงก์ช่อง / โปรไฟล์ <span class="req">*</span></label><input name="channel_url" inputmode="url" placeholder="https://" required>
    <div class="row2">
      <div><label>ผู้ติดตาม</label><input name="followers" inputmode="numeric" placeholder="เช่น 12000"></div>
      <div><label>Username Affiliate</label><input name="platform_affiliate_id" placeholder="ใช้จับคู่ยอดขาย"></div>
    </div>

    </div>
    <label class="check" style="margin-top:18px"><input type="checkbox" name="consent"> <span>ยินยอมให้เก็บและใช้ข้อมูลส่วนบุคคล (ชื่อ เบอร์ ที่อยู่) เพื่อดำเนินโปรแกรม Affiliate และจัดส่งสินค้า ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล</span></label>
    <button class="btn" style="margin-top:18px" id="submit">ส่งใบสมัคร</button>
  </form>`;
  document.querySelectorAll('#cats .chip').forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));

      go(r.affiliate.status === 'approved' ? 'me' : 'register');
    });
  });
}

  loading();
  try {
    const d = await api('requests');
    if (!d.requests.length) { app.innerHTML = `<div class="card empty">ยังไม่มีคำขอ<br><br><button class="btn sm" onclick="go('catalog')">ขอสินค้าตัวอย่าง</button></div>`; return; }
    app.innerHTML = `<div class="card list">${d.requests.map(r => `
      <div class="item">
        <div class="top"><span class="title">${esc(r.product_name)}</span><span class="badge ${REQ_BADGE[r.status] || ''}">${esc(r.status_th)}</span></div>
        <div class="muted">ขอเมื่อ ${esc(r.requested_at)}${r.tracking_no ? ` · ${esc(r.carrier)} <b>${esc(r.tracking_no)}</b>` : ''}</div>
        ${r.content_due && !r.content_url ? `<div class="muted" style="color:${r.overdue ? 'var(--bad)' : ''}">ส่งคอนเทนต์ภายใน ${esc(r.content_due)}${r.overdue ? ' (เลยกำหนด)' : ''}</div>` : ''}
        ${r.content_url ? `<div class="muted">คอนเทนต์: <a href="${esc(r.content_url)}" target="_blank" rel="noopener">${esc(r.content_url.slice(0, 40))}…</a></div>` : ''}
        ${r.can_submit ? `<div class="inline"><input placeholder="วางลิงก์โพสต์/คลิป" data-url="${esc(r.request_id)}" inputmode="url"><button class="btn sm" data-req="${esc(r.request_id)}">ส่ง</button></div>` : ''}
      </div>`).join('')}</div>`;
    app.querySelectorAll('[data-req]').forEach(b => b.addEventListener('click', () => {

}

/* ---------- Mock API (โหมด Prototype) ---------- */
const MOCKDB = {
  aff: null, points: 0,
  products: [
    { sku: 'S1', name: 'เซรั่มวิตามินซี 30ml', category: 'Beauty', image_url: '', stock: 12, commission_note: 'คอมฯ 12%' },
    { sku: 'S2', name: 'กราโนล่าโฮลเกรน', category: 'Food', image_url: '', stock: 8, commission_note: 'คอมฯ 8%' },
    { sku: 'S3', name: 'หูฟังไร้สาย Lite', category: 'Gadget', image_url: '', stock: 3, commission_note: 'คอมฯ 6%' },
    { sku: 'S4', name: 'ครีมกันแดด SPF50', category: 'Beauty', image_url: '', stock: 20, commission_note: 'คอมฯ 10%' },
  ],
  requests: [], acts: [], redemptions: [], checkin: false,
  rewards: [{ reward_id: 'R1', name: 'บัตรกำนัล 100 บาท', points_cost: 500, stock: 20 }, { reward_id: 'R2', name: 'เซ็ตสินค้าพรีเมียม', points_cost: 1500, stock: 5 }],
  steps: [{ step: 1, min_sales: 10000, bonus: 300 }, { step: 2, min_sales: 30000, bonus: 1200 }, { step: 3, min_sales: 80000, bonus: 4000 }],
};
function mockApi(action, d) {
  const db = MOCKDB, wait = v => new Promise(r => setTimeout(() => r(v), 250));
  const fail = m => new Promise((_, j) => setTimeout(() => j(new Error(m)), 250));
  const addPts = (type, p) => { db.points += p; db.acts.unshift({ type, points: p, verified: true, date: 'วันนี้' }); };
  const pub = () => db.aff && Object.assign({}, db.aff, { points: db.points });
  switch (action) {
    case 'me': return wait({ name: 'ผู้ทดสอบ', lead_ref: d.ref || '', affiliate: pub(), brand: 'Affiliate Club' });
    case 'register': {
      const f = d.form;
      for (const k of ['full_name', 'phone', 'platform', 'channel_url', 'address', 'province', 'postcode']) if (!String(f[k] || '').trim()) return fail('กรุณากรอกข้อมูลที่มี * ให้ครบ');
      if (!f.consent) return fail('กรุณายินยอมให้เก็บข้อมูลส่วนบุคคล');
      db.aff = { affiliate_id: 'AF-DEMO', full_name: f.full_name, platform: f.platform, status: 'approved', my_ref_code: 'K7Q2MX', registered_at: 'วันนี้' };
      addPts('register', 50);
      return wait({ affiliate: pub() });
    }
    case 'catalog': {
      const used = db.requests.filter(r => r.status !== 'rejected').length;
      return wait({ products: db.products, quota: { limit: 2, used, remaining: Math.max(0, 2 - used) }, blocked: false, overdue: [] });
    }
    case 'requestSample': {
      if (db.requests.length >= 2) return fail('ใช้โควตาเดือนนี้ครบแล้ว (2 ชิ้น)');
      const p = db.products.find(x => x.sku === d.sku);
      if (db.requests.some(r => r.sku === d.sku)) return fail('คุณขอสินค้านี้ไว้แล้ว รอดำเนินการอยู่');
      const shipped = db.requests.length === 0;
      db.requests.unshift({ request_id: 'RQ' + Date.now(), sku: p.sku, product_name: p.name, status: shipped ? 'shipped' : 'requested',
        status_th: shipped ? 'จัดส่งแล้ว' : 'รออนุมัติ', carrier: shipped ? 'Kerry' : '', tracking_no: shipped ? 'KEX1234567890' : '',
        requested_at: 'วันนี้', content_due: shipped ? 'อีก 7 วัน' : '', content_url: '', can_submit: shipped, overdue: false });
      return wait({});
    }
    case 'requests': return wait({ requests: db.requests });
    case 'submitContent': {
      const r = db.requests.find(x => x.request_id === d.request_id);
      Object.assign(r, { content_url: d.url, status: 'content_submitted', status_th: 'ส่งคอนเทนต์แล้ว', can_submit: false });
      db.acts.unshift({ type: 'content', points: 100, verified: false, date: 'วันนี้' });
      return wait({});
    }
    case 'dashboard': {
      const sales = 18400, steps = db.steps;
      const current = steps.filter(s => sales >= s.min_sales).pop() || null, next = steps.find(s => sales < s.min_sales) || null;
      return wait({ affiliate: pub(), period: '2026-10', sales_this_month: sales, sales_last_month: 9200,
        bonus: { steps, current, next, remaining: next ? next.min_sales - sales : 0, unit: 'บาท' },
        bonuses: [{ period: '2026-09', total_sales: 32500, step: 2, bonus: 1200, status: 'paid', status_th: 'จ่ายแล้ว' }],
        activities: db.acts, checked_in_today: db.checkin, points_checkin: 5 });
    }
    case 'checkin': if (db.checkin) return fail('วันนี้เช็กอินแล้ว'); db.checkin = true; addPts('checkin', 5); return wait({ points: 5 });
    case 'rewards': return wait({ points: db.points, rewards: db.rewards, redemptions: db.redemptions });
    case 'redeem': {
      const r = db.rewards.find(x => x.reward_id === d.reward_id);
      if (db.points < r.points_cost) return fail('แต้มไม่พอ');
      addPts('redeem', -r.points_cost); r.stock--;
      db.redemptions.unshift({ reward_name: r.name, points_cost: r.points_cost, status: 'pending', status_th: 'รอจัดส่ง', date: 'วันนี้' });
      return wait({});
    }
  }
  return fail('unknown action');
}
